colophon.xhtml: |
  This file contains publication and production information for the Standard Ebooks edition of "David Copperfield." It documents that the original novel was published in 1850 by Charles Dickens. The ebook was produced by Alex Cabal for Standard Ebooks, based on a 2009 transcription by Jo Churcher and David Widger for Project Gutenberg, with additional reference to digital scans from the Internet Archive. The colophon details the visual design elements: the cover is adapted from Carl Spitzweg's painting "The Writer" (circa 1850), and the typography uses League Spartan and Sorts Mill Goudy typefaces created by The League of Moveable Type in 2014 and 2009 respectively. This specific edition was released on September 9, 2025, at 9:40 p.m., based on revision bf32aa8, with the first edition having been released on May 19, 2015. The file provides a link where readers can check for updates, view revision history, or download the ebook in different formats. It concludes with an invitation for readers to contribute improvements, corrections, and typo reports to the volunteer-driven Standard Ebooks project, emphasizing the collaborative nature of the organization.

uncopyright.xhtml: |
  This file serves as a public domain dedication statement for the ebook, explaining the copyright status and usage rights. It begins with a poetic blessing about doing good, forgiveness, and sharing freely. The document explains that unlike traditional copyright pages that restrict usage, this "Uncopyright" page clarifies that the writing and artwork are believed to be in the United States public domain, making them free of copyright restrictions for U.S. users. The file provides important caveats: copyright laws vary internationally, so users outside the United States must verify their local laws before using the ebook. It emphasizes that "sweat of the brow" work—such as digitization, markup, or typography—doesn't create new copyright on public domain items. The contributors release their work under the CC0 1.0 Universal Public Domain Dedication, dedicating all contributions (metadata, formatting, markup, and enhancements) to the worldwide public domain. This dedication aims to enrich global cultural heritage and promote free culture, while clarifying that it doesn't alter the copyright status of the original source text or artwork. The page embodies Standard Ebooks' philosophy of giving back to the unrestricted culture that benefits everyone.
