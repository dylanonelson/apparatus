    title: 'XXXVIII: A Dissolution of Partnership'
  - href: epub/text/chapter-39.xhtml
    last_position: 564
    start_position: 547
    summary: 'David visits Canterbury to see Agnes and deliver a letter to Dora''s aunts proposing formal
