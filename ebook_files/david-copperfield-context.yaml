      smug respectability. Mrs. Steerforth appears, greatly aged, explaining she paid Littimer for this
      information to warn Mr. Peggotty and prevent Emily from ensnaring Steerforth again. She acknowledges
      David''s success as a writer and dismisses him coldly. David observes the two women gazing at the
      darkening prospect, with mist rising "like a sea" that seems to encompass them—a foreboding image.
      David finds Mr. Peggotty in his Hungerford Market lodging, kept ready for Emily''s return. David
      shares the news. Mr. Peggotty is devastated but insists Emily lives: "I am told as she''s alive!"
      David suggests enlisting Martha''s help, knowing Emily had been charitable to her and that Martha
      would search London''s streets effectively. They find Martha by the river, contemplating suicide,
      crying "Oh, the river!" Martha says the river haunts her—it''s "the only thing in all the world
      that I am fit for." Mr. Peggotty asks her to search for Emily, offering complete trust. Martha solemnly
      vows to dedicate herself to this task, seeing it as potential redemption.'
    title: 'XLVI: Intelligence'
  - href: epub/text/chapter-47.xhtml
    last_position: 669
    start_position: 659
    summary: 'David and Mr. Peggotty follow Martha through Westminster to the Thames riverside near Millbank
      Prison. The setting is memorably bleak: a "dreary" wasteland with rotting unfinished houses, rusty
      industrial refuse, slimy gaps, and "the rags of last year''s handbills offering rewards for drowned
      men." Martha stands at the river''s edge in despair. They approach carefully, and David calls her
      name. She screams and struggles but recognizes Mr. Peggotty. Sitting among stones, she repeatedly
      cries "Oh, the river!"—seeing it as her destiny: "It comes from country places, where there was
      once no harm in it—and it creeps through the dismal streets, defiled and miserable—and it goes away,
