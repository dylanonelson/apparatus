      Mr. Wickfield and threatened Agnes.'
    title: 'XLIX: I Am Involved in Mystery'
  - href: epub/text/chapter-50.xhtml
    last_position: 703
    start_position: 694
    summary: 'After months of searching, Mr. Peggotty remains unwavering in his belief that he will find
      Emily. Martha summons David urgently one evening, leading him through London''s poorer districts
      to a lodging house where Emily has been located. In a dramatic confrontation, Rosa Dartle, consumed
      with hatred for Emily, arrives first and viciously berates the fallen woman with cruel accusations
      and threats. Rosa''s rage stems from her unrequited love for Steerforth and jealousy of Emily. She
      tells Emily to hide herself or face public exposure, showing no mercy despite Emily''s tears and
      pleas. The chapter''s emotional climax occurs when Mr. Peggotty finally arrives and finds Emily
      unconscious. The memorable scene shows the tenderhearted uncle supporting his niece, covering her
      face with a handkerchief, and thanking Heaven: "I thank my Heav''nly Father as my dream''s come
      true!" He carries Emily from the house, fulfilling his long quest. The chapter powerfully contrasts
      Rosa''s vindictive cruelty with Mr. Peggotty''s unconditional love and forgiveness. David witnesses
      both the depths of human malice and the heights of compassionate devotion. The famous passage describing
      Rosa Dartle''s fury—her scar throbbing, her face contorted with rage—is one of Dickens''s most vivid
      portraits of destructive passion. Emily''s redemption through her uncle''s love sets the stage for
      their emigration to Australia and a new beginning.'
    title: 'L: Mr. Peggotty’s Dream Comes True'
  - href: epub/text/chapter-51.xhtml
    last_position: 719
    start_position: 704
    summary: 'Mr. Peggotty describes Emily''s journey after fleeing from Steerforth. She wandered along
