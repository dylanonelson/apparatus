    title: 'XLVIII: Domestic'
  - href: epub/text/chapter-49.xhtml
    last_position: 693
    start_position: 681
    summary: 'David receives a mysterious letter from Mr. Micawber requesting a secret meeting outside
      the King''s Bench Prison. The letter is written in Micawber''s characteristically verbose style,
      hinting at hidden troubles. Traddles also receives a distressed letter from Mrs. Micawber describing
      her husband''s strange behavior, violent outbursts, and references to having "sold himself to the
      D." David and Traddles meet Micawber, who appears agitated and broken, speaking cryptically about
      Uriah Heep. The chapter builds suspense as Micawber struggles with whether to reveal his secrets.
      After being brought to Miss Trotwood''s house, Micawber finally explodes with rage, denouncing Heep
