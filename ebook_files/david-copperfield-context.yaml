    title: 'XXXIII: Blissful'
  - href: epub/text/chapter-34.xhtml
    last_position: 486
    start_position: 478
    summary: 'David writes to Agnes about his engagement to Dora, feeling emotional as he composes the
      letter. Her warm reply comforts him. Traddles visits David''s chambers, having befriended Peggotty.
      Mrs. Crupp, David''s landlady, resigns her duties in protest of Peggotty''s presence and writes
      an indignant letter about "spies" and "intruders." Traddles helps David purchase his possessions
