      declaration: "Villainy is the matter; baseness is the matter; deception, fraud, conspiracy, are
      the matter; and the name of the whole atrocious mass is—HEEP!" He vows to "blow to fragments" this
      "detestable serpent" and schedules a formal revelation for the following week at Canterbury. After
      his emotional explosion, Micawber rushes from the house but later sends an apologetic letter promising
      to expose Heep''s crimes. The chapter masterfully builds tension through Micawber''s mysterious
