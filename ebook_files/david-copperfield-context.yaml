      becomes an enduring image of faithful, forgiving love.'
    title: 'XXXII: The Beginning of a Long Journey'
  - href: epub/text/chapter-33.xhtml
    last_position: 477
    start_position: 462
    summary: David is deeply in love with Dora Spenlow and saturated with thoughts of her. He makes night-time
