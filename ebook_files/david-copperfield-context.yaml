      Mr. Dick suddenly leads Mrs. Strong into the study, where she falls to her knees before the Doctor
      with that "memorable look" David has seen before. In a long, emotional speech, Mrs. Strong reveals
      her whole heart: she married the Doctor out of gratitude and deep respect, seeing him as father
      and guide. Her mother first suggested mercenary motives, which poisoned her happiness. She had been
      fond of her cousin Maldon in childhood, but realized marriage to him would have been miserable—"There
      can be no disparity in marriage like unsuitability of mind and purpose." She knew Maldon''s false
      heart when he made improper advances, which she never revealed out of shame. Her love for the Doctor
      was "founded on a rock" and endures. The reconciliation is complete, with Mr. Dick receiving credit
      for his wisdom, while the Old Soldier is defeated.'
    title: 'XLV: Mr. Dick Fulfils My Aunt’s Predictions'
  - href: epub/text/chapter-46.xhtml
    last_position: 658
    start_position: 646
    summary: 'Walking past Mrs. Steerforth''s gloomy house, David is summoned by Miss Dartle. In the garden,
