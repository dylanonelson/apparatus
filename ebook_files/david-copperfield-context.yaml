- href: epub/text/preface-1850.xhtml
  last_position: 5
  start_position: 4
  summary: This file contains Charles Dickens's original preface written for the 1850 edition of "David
    Copperfield," composed immediately after completing the novel. The preface is deeply personal and
    reflective, revealing Dickens's intimate emotional connection to his work. He candidly expresses the
    difficulty of achieving composure when writing about a book he has just finished, describing his mind
    as "divided between pleasure and regret"—pleasure in accomplishing a long-planned design, and regret
    at separating from the many characters who had been his companions throughout the creative process.
    Dickens acknowledges that he has little to say formally about the story beyond what he has already
    expressed within the narrative itself. He poignantly describes the sorrowful experience of laying
    down his pen after a two-year imaginative task, comparing it to "dismissing some portion of himself
    into the shadowy world" as the creatures of his imagination depart from him forever. Rather than dwelling
    on the completion, Dickens chooses to look forward optimistically to his future monthly publications,
    metaphorically described as "two green leaves once a month." He concludes with grateful remembrance
    of the favorable reception ("genial sun and showers") that the serialized publication of David Copperfield
    received, which brought him happiness. The preface is dated London, October 1850, and provides valuable
    insight into Dickens's creative process and the emotional investment he placed in this particular
    novel.
  title: Preface to the 1850 Edition
- href: epub/text/preface.xhtml
  last_position: 7
  start_position: 6
  summary: 'This preface, written for the Charles Dickens Edition in 1869, represents Dickens''s later
    reflections on "David Copperfield" nearly two decades after its original publication. The preface
    begins by referencing and partially repeating content from his 1850 preface, reaffirming the emotions
    he felt upon completing the novel—the difficulty of achieving composure, the divided feelings of pleasure
    and regret, and the sensation of dismissing creatures of his imagination into the shadowy world. However,
    this later preface adds a profoundly significant new revelation that has become one of Dickens''s
    most famous statements about his work. After confirming that his earlier sentiments remain true, Dickens
    takes readers into "one confidence more," declaring: "Of all my books, I like this the best." He acknowledges
    being a fond parent to all his literary creations and loving the entire family of his works dearly,
    but admits that like many fond parents, he has "in my heart of hearts a favourite child. And his name
    is David Copperfield." This declaration is particularly meaningful given Dickens''s prolific output
    and the many beloved novels he produced throughout his career. The statement ends poignantly with
    "David Copperfield" appearing as a signature, dated 1869. This preface has become historically significant
    for literary scholars and Dickens enthusiasts because it explicitly identifies which of his many masterpieces
    the author himself cherished most deeply, providing unique insight into his personal preferences and
    the special place this semi-autobiographical novel held in his affections.'
  title: Preface to the Charles Dickens Edition
- href: epub/text/dedication.xhtml
  last_position: 8
  start_position: 8
  summary: 'This dedication page is a brief, formal document that inscribes "David Copperfield" to specific
    individuals from Dickens''s personal life. The file contains a simple but elegant dedication reading:
    "Affectionately inscribed to the Hon. Mr. and Mrs. Richard Watson, of Rockingham, Northamptonshire."
    This dedicatory inscription follows traditional 19th-century literary conventions where authors would
    honor friends, patrons, or important figures by dedicating their works to them. The use of "affectionately"
    suggests a warm personal relationship between Dickens and the Watsons, moving beyond mere formal courtesy.
    Richard Watson and his wife were evidently people of some social standing, as indicated by the honorific
    "Hon." (Honourable) and their association with Rockingham in Northamptonshire, England. Historically,
    Rockingham House was a significant estate, and the Watsons were among Dickens''s circle of friends.
    Such dedications served multiple purposes in Victorian literature: they acknowledged personal relationships,
    potentially provided a measure of patronage or social endorsement, and demonstrated the author''s
    connections within society. The dedication is structured as frontmatter content within the XHTML document,
    properly categorized with semantic markup for digital publishing. While minimal in content, this page
    represents an important element of the book''s original publication, preserving the personal dimension
    of Dickens''s work and his relationships with contemporaries who supported or inspired his writing.
    The dedication adds historical and biographical context to the novel.'
  title: Dedication
- children:
  - href: epub/text/chapter-1.xhtml
    last_position: 20
    start_position: 10
    summary: 'David Copperfield begins his autobiography on a Friday at midnight, with superstitious whispers
      that he was born to see ghosts and that he will be unlucky in life. His father died six months before
      his birth, leaving his young mother Clara as a widow. The family home is Blunderstone Rookery in
      Suffolk. David''s formidable great-aunt, Betsey Trotwood, arrives on the night of his birth, having
      quarreled with David''s father years earlier. She is convinced the baby will be a girl named after
      herself. When she discovers the infant is a boy, she storms out in disappointment and disappears
      from their lives for years. David''s early childhood is idyllic, spent with his gentle mother and
      their devoted servant Peggotty. The household is peaceful and loving. Peggotty, with her cheerful
      disposition and rough red fingers, becomes David''s surrogate mother figure. The chapter establishes
      the major themes of the novel: fate versus self-determination, the importance of surrogate families,
      and the power of memory in shaping identity. Famous passage: "Whether I shall turn out to be the
      hero of my own life, or whether that station will be held by anybody else, these pages must show."
      This opening line immediately establishes the narrative''s self-reflective quality and questions
      about agency and identity that permeate the entire novel. The chapter masterfully sets up David''s
      orphan status while introducing the eccentric Aunt Betsey who will become crucial to his salvation
      later.'
    title: 'I: I Am Born'
  - href: epub/text/chapter-2.xhtml
    last_position: 34
    start_position: 21
    summary: 'Young David enjoys an idyllic childhood with his mother and Peggotty. He notices a change
      when a mysterious gentleman, Mr. Murdstone, begins paying attention to his mother during church
      and taking walks with her. David feels jealous and possessive of his mother''s affection. Peggotty
      proposes taking David to visit her family at Yarmouth for a fortnight, which his mother eagerly
      approves. At Yarmouth, David meets Peggotty''s brother Mr. Peggotty, a kind-hearted fisherman who
      lives in an upturned boat converted into a home on the beach. There David meets Ham, Mr. Peggotty''s
      nephew, a gentle giant of a young man, and most importantly, little Emily, Mr. Peggotty''s orphaned
      niece whom David immediately adores. Emily, with her wild beauty and capricious nature, captures
      David''s heart. She dreams of becoming a lady and expresses fear of the sea despite living beside
      it. They play together as childhood sweethearts, and David promises to marry her when they grow
      up. The boat-house home represents warmth, simplicity, and genuine family love despite the occupants
      being a makeshift family of orphans and strays. This visit provides David with happy memories and
      establishes the Peggotty family as his alternative refuge. Famous passage: Emily''s declaration
      that she wishes she could be a lady foreshadows her tragic trajectory. When David returns home,
      he discovers his mother has married Mr. Murdstone during his absence, a betrayal that shatters his
      childhood innocence and marks the end of his carefree existence.'
    title: 'II: I Observe'
  - href: epub/text/chapter-3.xhtml
    last_position: 49
    start_position: 35
    summary: 'David returns from Yarmouth to find his mother married to the stern Mr. Murdstone. His childhood
      paradise is destroyed. Mr. Murdstone is cold, authoritarian, and methodical in his cruelty, believing
      in "firmness" as the guiding principle. He transforms the once-happy household into a prison of
      discipline and fear. David''s mother, though still loving, becomes weak and fearful under her new
      husband''s dominance. Mr. Murdstone''s equally harsh sister, Jane Murdstone, arrives to take over
      household management, further isolating David''s mother. She carries keys ominously, symbolizing
      her control over everything. The sisters and their brother form an alliance against the child, treating
      him with calculated coldness. David is sent to his room as punishment, isolated from his mother.
      He finds solace in reading his late father''s books, especially adventure stories like "Tom Jones,"
      "The Vicar of Wakefield," and "Robinson Crusoe," which become his refuge. These books feed his imagination
      and provide escape. Mr. Murdstone imposes rigorous lessons on David, who becomes paralyzed with
      fear and cannot perform. When he fails at his lessons, severe punishment is threatened. The psychological
      torture is methodical—the Murdstones deliberately break David''s spirit and his mother''s will.
      The chapter depicts child abuse through coldness, intimidation, and emotional manipulation. Famous
      passage: David''s description of reading as his sanctuary establishes literature as salvation. The
      chapter shows how quickly domestic tyranny can destroy happiness, and how the vulnerable—both David
      and his mother—suffer under authoritarian cruelty that masquerades as moral firmness and proper
      discipline.'
    title: 'III: I Have a Change'
  - href: epub/text/chapter-4.xhtml
    last_position: 67
    start_position: 50
    summary: 'Mr. Murdstone continues David''s education with brutal severity. During lessons, David becomes
      so terrified he cannot concentrate or remember anything. When he fails repeatedly, Mr. Murdstone
      decides to beat him. David''s mother pleads for mercy, but Miss Murdstone holds her back. In desperation,
      during the beating, David bites Mr. Murdstone''s hand in self-defense. This act of resistance seals
      his fate. He is immediately labeled vicious and uncontrollable. David is imprisoned in his room
      for five days, seeing no one but Miss Murdstone, who brings his meals in stern silence. On the fifth
      day, he is informed he is being sent away to boarding school. Before he leaves, he is permitted
      to see his mother one final time. The goodbye is heartbreaking—his mother holds him tenderly, but
      Miss Murdstone cuts their farewell short. Peggotty secretly comes to his room that night to comfort
      him and give him money, pressing coins into his hand and promising her enduring love and loyalty.
      David is taken away by Mr. Barkis, the carrier, who drives him to the coaching inn. Mr. Barkis,
      taciturn but kind, learns David knows Peggotty and asks him to deliver a message: "Barkis is willin'',"
      indicating his romantic interest in Peggotty. This simple phrase becomes a recurring motif. David
      travels alone to London, feeling abandoned and labeled with a sign warning that he bites, which
      humiliates him before strangers. At Salem House school in Blackheath, he arrives to find it empty
      during holidays. The chapter captures David''s first major exile from home, the trauma of physical
      and emotional abuse, and his classification as a "problem child" when he is actually a victim.'
    title: 'IV: I Fall Into Disgrace'
  - href: epub/text/chapter-5.xhtml
    last_position: 84
    start_position: 68
    summary: 'David arrives at Salem House school during holidays and meets Mr. Creakle, the tyrannical
      headmaster with a terrible reputation for cruelty. Mr. Creakle, whose voice is a harsh whisper due
      to throat problems, is assisted by Tungay, his equally brutal servant. David is humiliated by being
      forced to wear a sign on his back reading "Take care of him. He bites," ensuring all boys will mock
      him. During the empty holiday period, David befriends two people who will become important: Tommy
      Traddles, a good-natured boy who draws skeletons on his slate and will later become a close friend,
      and James Steerforth, a handsome, charismatic older boy who treats David with condescending kindness.
      Steerforth embodies everything David admires: confidence, good looks, aristocratic bearing, and
      power over others. David immediately idolizes him, lending him money and telling him stories. Steerforth
      exploits this worship casually, spending David''s money on luxuries they share, but David considers
      it an honor. The chapter establishes Steerforth as David''s hero despite early warning signs of
      his selfishness and moral carelessness. When school begins, Salem House proves to be exactly as
      terrible as feared. Mr. Creakle rules through fear and physical punishment, beating boys regularly
      with cruel enthusiasm. He particularly enjoys humiliating David because of his sign. The assistant
      headmaster, Mr. Sharp, is also harsh, though less sadistic. Only the elderly head Latin master,
      Mr. Mell, shows any kindness, though he is poor, shabby, and looked down upon by Steerforth. The
      school represents Victorian educational brutality. Dickens based Salem House on his own traumatic
      school experiences, making this a powerful critique of institutional cruelty toward children.'
    title: 'V: I Am Sent Away from Home'
  - href: epub/text/chapter-6.xhtml
    last_position: 92
    start_position: 85
    summary: 'David adjusts to life at Salem House under Mr. Creakle''s brutal regime. He finds solace
      in friendships with Traddles and continued worship of Steerforth. One day, Steerforth publicly humiliates
      Mr. Mell, the poor but kind teacher, by revealing that his mother lives in an almshouse, attacking
      his poverty and position. Mr. Creakle, supporting Steerforth because of his wealthy background,
      dismisses Mr. Mell from the school. David witnesses this injustice but doesn''t recognize Steerforth''s
      cruelty, remaining loyal to his hero. David''s adoration of Steerforth blinds him to significant
      character flaws—his casual cruelty, class snobbery, and exploitation of those weaker than himself.
      This pattern of David''s misjudgment of Steerforth foreshadows future tragedy. Life at school continues
      with regular beatings and misery. David distinguishes himself academically but suffers under Creakle''s
      tyranny. During the holidays, David expects to go home but receives devastating news: his mother
      has died shortly after giving birth to a baby boy, who has also died. David is shattered by grief.
      His idyllic childhood memories are now all he has left of his mother. Peggotty arrives to collect
      him and take him home to Blunderstone for the funeral. She provides comfort and tells him details
      about his mother''s decline under the Murdstones'' harsh treatment. The chapter marks a profound
      turning point—David''s loss of his last true parent and the end of any possibility of returning
      to the happiness of his early childhood. His mother''s death leaves him essentially orphaned and
      completely at the Murdstones'' mercy. The theme of surrogate families becomes even more important.
      Famous passage: David''s description of his mother''s death and his inability to imagine her as
      anything but young and beautiful.'
    title: 'VI: I Enlarge My Circle of Acquaintance'
  - href: epub/text/chapter-7.xhtml
    last_position: 109
    start_position: 93
    summary: 'After his mother''s funeral, David returns to Blunderstone Rookery, but now it feels cold
      and unwelcoming under the Murdstones'' complete control. The house is transformed from his childhood
      home into a prison. Miss Murdstone rules with absolute authority while Mr. Murdstone coldly ignores
      David. He is kept isolated from everyone except Peggotty, who remains fiercely loyal despite the
      Murdstones'' hostility toward her. David receives no education and is left in neglect, seemingly
      forgotten. This state of limbo continues for months. The Murdstones make no plans for his future.
      He exists in isolation, reading in his room. Eventually, Mr. Murdstone decides David''s future:
      he will not continue his education but will be sent to work. David, only ten years old, is taken
      to London by Mr. Murdstone and delivered to Murdstone and Grinby''s warehouse, a wine bottling establishment
      near the Thames. He is to work washing and labeling bottles alongside working-class boys for six
      or seven shillings a week. This is his punishment and abandonment. At the warehouse, David experiences
      the trauma of child labor. He meets his coworkers: young boys including Mick Walker and a boy he
      calls Mealy Potatoes due to his diet. The work is degrading, mechanical, and soul-destroying for
      a sensitive child who had expected to be educated as a gentleman. David feels profound shame at
      his fall in status. The warehouse episode is based on Dickens''s own traumatic childhood experience
      working at Warren''s Blacking Factory, which haunted him throughout his life. This autobiographical
      element gives the chapter particular power and emotional authenticity. David''s sense of abandonment,
      social humiliation, and lost potential reflects Dickens''s own psychological wounds. Dickens waited
      until near death to reveal this childhood trauma publicly.'
    title: 'VII: My “First Half” at Salem House'
  - href: epub/text/chapter-8.xhtml
    last_position: 123
    start_position: 110
    summary: David works at Murdstone and Grinby's warehouse in misery and isolation. His lodgings are
      arranged with Mr. and Mrs. Micawber at their house in Windsor Terrace, City Road. The Micawbers
      are perpetually in financial crisis despite Mr. Micawber's grand manner and optimistic declarations
      that "something will turn up." They live in genteel poverty, constantly harassed by creditors, pawning
      possessions, and scheming to avoid debtors' prison. Despite their circumstances, the Micawbers are
      warm and generous to David, treating him almost as family. Mrs. Micawber, dramatically loyal to
      her improvident husband, repeatedly declares she will never desert Mr. Micawber. Their twins and
      other children add to the household chaos. David, though a child himself, often acts as the adult,
      managing their pawning transactions and struggling to help them. He becomes intimately acquainted
      with poverty, pawnshops, and the constant anxiety of debt. The Micawbers' financial catastrophe
      finally arrives when Mr. Micawber is arrested for debt and imprisoned in the King's Bench Prison.
      David visits him there regularly. The family moves into the prison with him, a common practice when
      debtors were incarcerated. Eventually, Mr. Micawber's debts are settled through insolvency proceedings,
      and he is released. The family decides to move to Plymouth for a fresh start. Before leaving, they
      have an emotional parting with David, promising eternal friendship. Mr. Micawber's declaration that
      "something will turn up" becomes his catchphrase and a symbol of his eternal optimism despite repeated
      disasters. The chapter brilliantly portrays the precariousness of middle-class existence and the
      debtor system's cruelty. Micawber is both comic and tragic—his pompous speech and eternal optimism
      clash with his genuine suffering and inability to provide for his family.
    title: 'VIII: My Holidays. Especially One Happy Afternoon'
  - href: epub/text/chapter-9.xhtml
    last_position: 135
    start_position: 124
    summary: 'After the Micawbers leave London, David''s loneliness becomes unbearable. He continues working
      at the warehouse but has nowhere to live. He takes miserable lodgings with a Mrs. Crupp-like landlady
      who treats him poorly. His isolation and degradation deepen. He wanders London streets, hungry and
      desperate, spending his meager wages on cheap food. He becomes familiar with London''s poorest neighborhoods
      and the life of working children. On Sundays, David sometimes visits monuments and churches, trying
      to maintain dignity and hope. He occasionally encounters Steerforth''s mother and her companion,
      Rosa Dartle, though he avoids identifying himself due to shame over his circumstances. One day,
      David impulsively decides he cannot continue this life. He resolves to run away and find his only
      living relative who might help him: his great-aunt Betsey Trotwood in Dover. He has only met her
      once on the night of his birth, but she represents his last hope. David plans his escape carefully.
      He has a small box of possessions and needs to transport it to Dover. He hires a young carrier to
      take his box but is immediately robbed—the carrier steals the box and the half-guinea David paid
      him. David begins the journey on foot with almost nothing. The three-day journey to Dover is an
      ordeal. David, exhausted and hungry, walks about seventy miles. He sells his waistcoat for money
      to buy food. He sleeps rough, encountering various characters on the road, some threatening. He
      is repeatedly robbed and cheated. By the time he reaches Dover, he is filthy, ragged, and desperate.
      The chapter depicts David at his lowest point, demonstrating remarkable courage and determination
      for a child to undertake such a desperate journey alone.'
    title: 'IX: I Have a Memorable Birthday'
  - href: epub/text/chapter-10.xhtml
    last_position: 153
    start_position: 136
    summary: 'David arrives in Dover exhausted, filthy, and desperate. He must find his Aunt Betsey Trotwood''s
      house but doesn''t know where she lives. He asks various people for directions to "Miss Trotwood,"
      eventually learning she lives on the outskirts of Dover. When he finally finds her cottage, which
      has a neat garden, he sees her for the first time since his birth. Aunt Betsey is initially startled
      by the ragged, dusty boy who appears at her gate. David identifies himself, and she is shocked to
      recognize her grand-nephew. She immediately takes charge, though in her abrupt, eccentric manner.
      She rails against the donkeys that trespass on her precious green in front of the house, chasing
      them away energetically—this is her peculiar obsession. Aunt Betsey listens to David''s story with
      growing indignation at the Murdstones'' treatment of him. She has him bathed and fed, and he sleeps
      properly for the first time in weeks. She consults her lodger, Mr. Dick, a harmless, gentle man
      with a mysterious past who lives in the house. Mr. Dick is "simple" or mentally fragile, rescued
      by Aunt Betsey from his family who wanted to institutionalize him. He works constantly on a "Memorial"
      (a petition) that is never completed because he cannot keep King Charles the First''s head out of
      it—an obsession representing his mental disturbance. Despite his oddities, Mr. Dick is kind and
      perceptive. When Aunt Betsey asks his advice about what to do with David, he offers simple but profound
      wisdom. Aunt Betsey writes to the Murdstones to inform them David is with her. David anxiously awaits
      their response, terrified he will be sent back. The chapter introduces Aunt Betsey as David''s salvation—eccentric,
      sharp-tongued, but fundamentally just and loving. She represents an alternative to the Murdstones''
      cruelty: discipline with affection, high standards with support.'
    title: 'X: I Become Neglected, and Am Provided For'
  - href: epub/text/chapter-11.xhtml
    last_position: 169
    start_position: 154
    summary: 'This chapter actually covers David''s time at Murdstone and Grinby''s warehouse in more
      detail, describing the psychological impact of his child labor and degradation. David describes
      the warehouse location near the Thames, surrounded by coal barges and rats. The building is dilapidated
      and filthy. His job is washing, rinsing, and labeling bottles—monotonous, degrading work that crushes
      his spirit. David works alongside boys from the working class: Mick Walker and Mealy Potatoes, who
      accept their station in life. David, however, was raised with expectations of education and gentlemanly
      status, making his fall more traumatic. He suffers profound shame, keeping his circumstances secret
      from everyone. The work represents more than physical hardship—it''s a spiritual and psychological
      death of his potential and dreams. David fears this is his permanent fate, that his childhood promise
      is being destroyed forever. He learns about adult poverty and struggle prematurely. He becomes familiar
      with pawnshops, where he regularly goes to pawn the Micawbers'' possessions. He learns to stretch
      pennies, buying the cheapest food—saveloys and pudding slices. He describes wandering London streets,
      observing the theatrical life of the city: covent Garden, street performers, shop windows full of
      items he cannot afford. The experience leaves permanent scars on David''s psyche. Even as an adult
      narrator, he describes these memories with pain. The famous passage is Dickens''s declaration that
      "No words can express the secret agony of my soul" at this degradation. The autobiographical intensity
      gives this chapter extraordinary emotional power. Dickens rarely spoke of his own childhood warehouse
      trauma, making David''s experience a veiled confession of his own suffering and shame that shaped
      his entire life and work.'
    title: 'XI: I Begin Life on My Own Account, and Don’t Like It'
  - href: epub/text/chapter-12.xhtml
    last_position: 179
    start_position: 170
    summary: 'David continues suffering at the warehouse and in his lonely lodgings. After the Micawbers
      leave, his isolation becomes complete. He takes new lodgings that are even worse, with a suspicious
      landlady. His solitary existence consists of work, cheap meals, and aimless walking through London.
      On weekends, he wanders to different parts of London, observing life but participating in none of
      it. He becomes a ghost in the city. Sometimes he goes to Covent Garden to watch the theater crowds,
      or to the City to observe the markets. He peers into shop windows and imagines different lives.
      The loneliness and degradation become unbearable. David realizes that the Murdstones have essentially
      abandoned him to permanent poverty and obscurity. They have made no provisions for his education
      or future. He understands that if he remains, his entire life will be this warehouse existence.
      This realization crystallizes into desperate resolve: he must escape and seek help from his only
      remaining relative, Aunt Betsey Trotwood. Though he barely knows her and she seemingly wanted nothing
      to do with his family after his birth, she represents his only hope. David makes careful plans for
      his escape. He has a small box with his few possessions and clothes. He must get both himself and
      the box to Dover, about seventy miles away. Having saved a small amount of money, he hires a young
      man with a cart to transport his box. However, he is immediately swindled—the carrier steals both
      the box and the money, leaving David with almost nothing. Undeterred, David begins walking to Dover.
      The journey takes days. He must buy food with his few remaining coins. He sleeps outdoors or in
      haystacks. Various people cheat and rob him along the way. He sells his waistcoat for money. By
      the time he approaches Dover, he is filthy, exhausted, and in rags, having walked nearly seventy
      miles.'
    title: 'XII: Liking Life on My Own Account No Better, I Form a Great Resolution'
  - href: epub/text/chapter-13.xhtml
    last_position: 198
    start_position: 180
    summary: David arrives in Dover after his arduous journey from London, exhausted and desperate. He
      must locate his Aunt Betsey's house but knows only that she lives in Dover. He asks various townspeople
      for directions to "Miss Trotwood" and eventually learns she lives in a cottage on the outskirts.
      When he finally arrives at her neat cottage with its garden and green in front, he sees his aunt
      for the first time since his birth. She is gardening and immediately notices the ragged, dusty boy
      at her gate. David introduces himself, and Aunt Betsey is astonished to recognize her grand-nephew
      David Copperfield. She exclaims her shock while simultaneously shooing away donkeys that trespass
      on her green—a peculiar obsession that interrupts even this dramatic moment. She takes David inside,
      giving him food and having the servant Janet prepare a bath. She listens to his story with growing
      fury at the Murdstones' treatment. She consults with her lodger, Mr. Dick (Mr. Richard Babley),
      a gentle, eccentric man she rescued from his family's attempt to institutionalize him. Mr. Dick
      lives upstairs working on a "Memorial" to petition the Lord Chancellor about his affairs, but he
      cannot complete it because King Charles the First's head keeps appearing in the text—his obsession
      and symbol of mental disturbance. Despite his oddities, Mr. Dick is perceptive and kind. When Aunt
      Betsey asks his advice about David, he suggests having clothes made for him. Aunt Betsey writes
      to the Murdstones informing them of David's location. She offers David a bedroom and clean clothes
      while they await the response. David is anxious and fearful that the Murdstones will force him to
      return. The chapter establishes Aunt Betsey as David's potential savior—eccentric, abrupt, but fundamentally
      just and compassionate, representing a stark contrast to the Murdstones' cruelty.
    title: 'XIII: The Sequel of My Resolution'
  - href: epub/text/chapter-14.xhtml
    last_position: 213
    start_position: 199
    summary: 'David waits anxiously at Aunt Betsey''s house for the Murdstones'' response to her letter.
      He fears being returned to his miserable life. Aunt Betsey maintains her usual routine, consulting
      Mr. Dick about his Memorial''s progress. She explains Mr. Dick''s history to David: he was considered
      "mad" by his brother and nearly institutionalized, but Aunt Betsey rescued him. His obsession with
      King Charles the First stems from the disturbance he suffered when his beloved sister married badly.
      Mr. Dick writes his troubles on his Memorial and then copies them onto a kite, flying it to disperse
      his troubles into the sky—a therapeutic ritual. David becomes fond of Mr. Dick. Finally, the Murdstones
      arrive—both Mr. Murdstone and his sister Jane on horseback. Miss Murdstone rides her donkey across
      Aunt Betsey''s sacred green, enraging her and beginning the confrontation badly. Aunt Betsey initially
      chases the donkey away with her usual fury before learning who the riders are. Once inside, the
      Murdstones present themselves as David''s injured parties. Mr. Murdstone describes David as sullen,
      rebellious, and ungrateful with a violent temper, claiming they tried to correct his vices but failed.
      Miss Murdstone confirms that David is the worst boy in the world. They explain they placed him in
      a respectable business (the warehouse), which he abandoned. Mr. Murdstone demands David''s return
      and warns Aunt Betsey that if she harbors him, she must keep him permanently—the Murdstones will
      close their doors to him forever. Aunt Betsey questions them sharply about whether they would have
      treated David the same if he were their own son, about his mother''s property, and about the boy''s
      welfare. David, positioned behind a chair like a prisoner in a dock, watches the confrontation.
      When asked if he wants to return to the Murdstones, David passionately refuses, begging Aunt Betsey
      to protect him. He testifies that the Murdstones made his mother miserable and have been cruel to
      him. Aunt Betsey turns to Mr. Dick for advice.'
    title: 'XIV: My Aunt Makes Up Her Mind About Me'
  - href: epub/text/chapter-15.xhtml
    last_position: 223
    start_position: 214
    summary: 'Mr. Dick''s advice is simple but perfect: "Have him measured for a suit of clothes directly."
      Aunt Betsey triumphantly accepts this wisdom and declares to the Murdstones that she will take responsibility
      for David. She dismisses them with a devastating speech about how they destroyed David''s mother
      through their tyranny and cruelty. She accuses Mr. Murdstone of courting Clara with false sweetness,
      then systematically breaking her spirit once married. She tells Miss Murdstone that if she ever
      rides a donkey across her green again, she will knock off her bonnet. The Murdstones leave humiliated.
      David is overwhelmed with relief and gratitude. Aunt Betsey announces he will be renamed Trotwood
      Copperfield, marking his new beginning. She has clothes purchased and marked with his new name.
      David''s life is transformed. He spends happy time with Aunt Betsey and Mr. Dick, particularly enjoying
      flying the great kite with Mr. Dick. David observes how Mr. Dick finds peace when flying the kite,
      as if it lifts his troubled thoughts into the sky. Aunt Betsey decides David needs proper education
      and chooses Doctor Strong''s school in Canterbury. She takes David to Canterbury to visit Mr. Wickfield,
      a lawyer and her business agent, to make arrangements. At Mr. Wickfield''s ancient, spotless house,
      they meet Uriah Heep, a cadaverous young clerk with red hair, no eyebrows or eyelashes, and a skeleton-like
      hand. His appearance immediately unsettles David. They also meet Mr. Wickfield himself, a distinguished
      man with white hair and a fondness for port wine. He is devoted to his young daughter Agnes, who
      is about David''s age. When they meet Agnes, David is struck by her serene, angelic quality—her
      calm face reminds him of a stained-glass church window. The school proves excellent, but suitable
      boarding is difficult to find. Mr. Wickfield offers to let David lodge with them, and Aunt Betsey
      gratefully accepts. Before leaving, Aunt Betsey gives David advice: "never be mean, never be false,
      never be cruel," and departs emotionally. David settles into his new life at Mr. Wickfield''s house.'
    title: 'XV: I Make Another Beginning'
  - href: epub/text/chapter-16.xhtml
    last_position: 243
    start_position: 224
    summary: David begins at Doctor Strong's school, meeting the absent-minded, kind-hearted headmaster
      who is much older than his pretty young wife, Annie Strong. The school is excellent—run on honor
      and trust, completely opposite to Salem House's tyranny. David learns that Annie Strong married
      the elderly Doctor for his status and to help her poor relations, particularly her cousin Jack Maldon.
      Mr. Wickfield is arranging a position for Jack Maldon abroad in India, suggesting he should be sent
      away from Mrs. Strong's presence. On his first day, David feels alienated from his schoolfellows.
      His experiences—working at the warehouse, knowing the Micawbers, sleeping in the King's Bench Prison,
      and his degraded life in London—separate him from their innocent boyhood. He fears they will discover
      his shameful past and judges himself harshly for knowledge he wishes he didn't have. However, the
      atmosphere at Mr. Wickfield's house soothes him. Agnes is the "little housekeeper," managing the
      household with mature grace despite being David's age. Her mother is dead; her portrait hangs in
      the house, and Agnes resembles her. Mr. Wickfield is devoted to Agnes but drinks heavily. David
      observes the father's dependence on his daughter. At dinner, Jack Maldon visits to discuss his imminent
      departure to India. He speaks disrespectfully about Doctor Strong ("the old Doctor") and hints that
      Mrs. Strong has influence over her elderly husband, implying an inappropriate power dynamic in their
      marriage. Mr. Wickfield rebukes his presumption firmly. After dinner, David encounters Uriah Heep
      in his office, studying legal texts. Uriah repeatedly describes himself and his late father as "'umble"
      people, claiming humility as his defining characteristic. However, his manner is unsettling—he has
      a writhing way of moving, his hands feel clammy and fishlike, and his eyes stare in an unblinking,
      uncomfortable way. When David politely suggests Uriah might someday become Mr. Wickfield's partner,
      Uriah insists he is far too humble for such advancement. He invites David to visit his humble home
      to meet his mother.
    title: 'XVI: I Am a New Boy in More Senses Than One'
  - href: epub/text/chapter-17.xhtml
    last_position: 260
    start_position: 244
    summary: David writes to Peggotty from Dover and Doctor Strong's school in Canterbury. He learns that
      the Murdstones have left and his childhood home is shuttered. Mr. Dick visits David regularly on
      Wednesdays, becoming beloved by the schoolboys despite his eccentricity. Mr. Dick reveals a mysterious
      man who frightens Aunt Betsey and to whom she secretly gives money in the moonlight. David suspects
      this may involve attempts to remove Mr. Dick from his aunt's protection. One day, David is invited
      to tea at Uriah Heep's humble dwelling, where Uriah and his mother persistently extract information
      about Mr. Wickfield and Agnes through their obsequious questioning. The visit becomes uncomfortable
      as David realizes he's revealed more than intended. Suddenly, Mr. Micawber appears at the door—the
      memorable character from David's childhood. Micawber is as eloquent and impecunious as ever, speaking
      of "something turning up" while residing temporarily in Canterbury with his wife. After a convivial
      dinner together featuring punch and reminiscences, Micawber sends David a characteristic despairing
      letter announcing financial ruin, only for David to see him the next morning departing cheerfully
      on the London coach, eating walnuts. This chapter reunites David with colorful figures from his
      past while introducing the unsettling dynamic of Uriah Heep's manipulation.
    title: 'XVII: Somebody Turns Up'
  - href: epub/text/chapter-18.xhtml
    last_position: 268
    start_position: 261
    summary: This poetic, impressionistic chapter captures David's school years through a series of vignettes
      rather than linear narrative. David recalls his early infatuation with Miss Shepherd, a boarding-school
      girl he adores from afar, eventually kissing her in the cloakroom before their relationship ends
      when she prefers another boy. He describes fighting the local butcher to defend Doctor Strong's
      honor, suffering a beating but earning Agnes's sympathetic care. Time passes swiftly—Adams, once
      head boy, becomes a barrister; David himself becomes head boy. Agnes transforms from child to woman,
      becoming his "sweet sister" and counselor. David, now wearing a gold watch and using bear's grease
      in his hair, falls desperately in love with the eldest Miss Larkins, a woman of thirty. He spends
      agonized hours outside her house, fantasizes about rescuing her from fire, and thrills when she
      dances a waltz with him at a ball, giving him a flower. His romantic dreams shatter when Agnes announces
      Miss Larkins's engagement to Mr. Chestle, a hop-grower. Dejected, David throws away the faded flower,
      fights the butcher again (this time victoriously), and resumes wearing his ring. The chapter memorably
      captures the intensity of adolescent emotions, the acceleration of time, and David's progression
      toward young manhood, all filtered through the haze of memory.
    title: 'XVIII: A Retrospect'
  - href: epub/text/chapter-19.xhtml
    last_position: 284
    start_position: 269
    summary: 'David''s schooldays end, and he must choose a profession. After deliberations with Aunt
      Betsey and Mr. Dick (who suggests "Brazier"), his aunt proposes he become a proctor in Doctors''
      Commons. She sends David on a preliminary trip to Yarmouth to visit Peggotty and gain perspective.
      In Canterbury, he bids farewell to Agnes, who warns him against Steerforth as his "bad Angel," though
      David defends his friend passionately. Agnes reveals troubling news: Uriah Heep is becoming her
      father''s partner. She explains that Uriah has made himself indispensable, mastering Mr. Wickfield''s
      weaknesses and creating a situation where her father is "afraid of him." Agnes accepted the partnership
      to relieve her father''s distress, though she grieves over his deterioration. At Doctor Strong''s,
      David learns of plans for the Doctor''s retirement and hears concerning news about Annie Strong''s
      cousin, Jack Maldon, returning from India due to illness. David observes Mr. Wickfield watching
      Annie Strong with suspicious intensity and recalls a troubling scene from Maldon''s departure. David
      begins to doubt the innocence of the Doctor''s young wife. Leaving Canterbury with these dark suspicions
      clouding his memory of his happy schooldays, David travels to London, where he unexpectedly encounters
      Steerforth at the inn, joyfully renewing their friendship.'
    title: 'XIX: I Look About Me, and Make a Discovery'
  - href: epub/text/chapter-20.xhtml
    last_position: 293
    start_position: 285
    summary: 'David accompanies Steerforth to Highgate, where he meets Steerforth''s proud, devoted mother
      and the sharp-tongued Rosa Dartle, a poor relation living with the family. Rosa bears a scar on
      her lip from a hammer that Steerforth threw at her in boyhood anger. David is attended by Littimer,
      Steerforth''s supremely respectable manservant, whose presence makes David feel excruciatingly young
      and inadequate. Rosa Dartle displays a peculiar manner of speaking—hinting rather than stating directly,
      making insinuating observations that often have a sarcastic edge. She questions Mrs. Steerforth
      about university life and later interrogates David about Mr. Peggotty''s family, wondering if such
      "common people" are "really animals and clods." Steerforth dismisses this, claiming such people
      are "not easily wounded" due to their "coarse rough skins." Rosa makes a cutting remark about how
      "consoling" it is to know that when such people suffer, "they don''t feel." The evening reveals
      the complex dynamics of the household: Mrs. Steerforth''s overwhelming devotion to her son, Rosa''s
      barely concealed intense feelings toward Steerforth, and the undercurrents of class consciousness.
      David retires to find Rosa Dartle''s portrait in his room, her scar seeming to come and go in the
      shadows, creating an unsettling presence that troubles his sleep.'
    title: 'XX: Steerforth’s Home'
  - href: epub/text/chapter-21.xhtml
    last_position: 312
    start_position: 294
    summary: 'David and Steerforth spend a fortnight in Yarmouth. David introduces Steerforth to the Peggotty
      household, and their arrival coincides with joyous news: Little Em''ly has agreed to marry Ham after
      initially refusing him. Mr. Peggotty radiates happiness, and the household celebrates. Steerforth
      charms everyone with his easy manners and natural grace. He sings beautifully, tells captivating
      stories, and even rouses the melancholy Mrs. Gummidge to cheerfulness. David observes Em''ly watching
      Steerforth with fascinated attention while keeping some distance from Ham. When they leave, Steerforth
      calls Em''ly "an engaging little Beauty" and describes the gathering as "quite a new sensation."
      He makes a dismissive comment about Ham being "rather a chuckle-headed fellow," which briefly shocks
      David, but Steerforth laughingly deflects any criticism. David passionately defends Steerforth''s
      genuine sympathy for common people, despite what he says to Miss Dartle. Steerforth responds enigmatically:
      "Daisy, I believe you are in earnest, and are good. I wish we all were!" The chapter introduces
      Littimer, Steerforth''s manservant, whose respectability makes everyone feel inferior. Steerforth
      reveals he has bought a boat to be captained by Mr. Peggotty and renamed the "Little Em''ly." David
      interprets this as characteristic generosity, though modern readers may detect more sinister motives.
      The chapter ends with foreboding undertones beneath the surface cheerfulness.'
    title: 'XXI: Little Em’ly'
  - href: epub/text/chapter-22.xhtml
    last_position: 333
    start_position: 313
    summary: 'David and Steerforth''s visit continues, with the friends separating frequently—Steerforth
      sailing with Mr. Peggotty while David makes melancholy pilgrimages to Blunderstone, visiting his
      parents'' grave and viewing his ruined childhood home. One dark evening, David finds Steerforth
      alone in brooding contemplation. Steerforth erupts in uncharacteristic despair, wishing he had "a
      judicious father" and could "guide myself better," declaring he''d rather be "this poor Peggotty"
      than himself. The mood passes quickly and Steerforth laughs it off. David and Steerforth encounter
      a mysterious, haggard woman following Ham and Em''ly. At dinner, they meet Miss Mowcher, an eccentric
      dwarf who works as hairdresser and cosmetician to the wealthy. She''s witty, sharp, and volatile.
      When Steerforth describes Em''ly in detail—her name, occupation, engagement to Ham, her beauty—Miss
      Mowcher responds knowingly. Later, David encounters Ham outside Mr. Barkis''s house. Ham explains
      Em''ly is inside with Martha Endell, a fallen woman and former friend desperately wanting to escape
      Yarmouth''s shame for London. After Martha leaves, Em''ly weeps bitterly, expressing her fears about
      not being good enough: "I am not as good a girl as I ought to be!" She clings to Peggotty and asks
      everyone to help her be better, revealing her inner turmoil. The chapter ends with Em''ly clinging
      to Ham as they walk home in the moonlight—a moment of apparent security that feels ominously fragile.'
    title: 'XXII: Some Old Scenes, and Some New People'
  - href: epub/text/chapter-23.xhtml
    last_position: 347
    start_position: 334
    summary: 'David resolves to become a proctor after Steerforth describes Doctors'' Commons as a "lazy
      old nook" dealing with ecclesiastical law, wills, and maritime disputes. During a London visit with
      Aunt Betsey, a disturbing incident occurs: a threatening man approaches them on the street, and
      David''s aunt frantically orders David away, goes off with the stranger, and returns having given
      him all her money. This corroborates Mr. Dick''s mysterious observations. David and his aunt visit
      the offices of Spenlow and Jorkins to arrange his articles. Mr. Spenlow, extremely starched and
      formal, explains the premium is £1,000, blaming the inflexible "Mr. Jorkins" for any difficult terms—though
      David later learns Jorkins is merely a device to deflect complaints. David tours the Consistory
      Court, finding it sleepy and antiquated, filled with Doctors in wigs arguing obscure ecclesiastical
      cases. Aunt Betsey arranges furnished chambers for David in Buckingham Street, Adelphi, where the
      previous tenant died of drink and smoke. Mrs. Crupp, the landlady, will provide services. David
      moves in, delighted with his independence. The transition from schoolboy to young professional is
      underway, though David feels overwhelmed by the ancient, arcane world of Doctors'' Commons. His
      aunt departs for Dover, leaving David to navigate London life alone. The chapter marks David''s
      entry into adulthood and professional life, though he remains very young and inexperienced despite
      his new responsibilities.'
    title: 'XXIII: I Corroborate Mr. Dick, and Choose a Profession'
  - href: epub/text/chapter-24.xhtml
    last_position: 356
    start_position: 348
    summary: David revels in his new independence, but evenings in his chambers grow lonely. He misses
      Agnes. After several days, Steerforth visits, and David impulsively invites him and two Oxford friends
      to dinner. The meal, prepared by the incompetent Mrs. Crupp through a pastrycook, includes various
      disasters, but David is determined to impress. His guests—Grainger and Markham—arrive, and David,
      nervous about appearing young, drinks too much wine. The evening becomes increasingly chaotic. David
      proposes extravagant toasts to Steerforth, becomes maudlin, drinks more, and eventually loses coherent
      control. Someone suggests the theatre. In David's drunken haze, they attend a performance where,
      to his horror, he encounters Agnes in a box with her friends. She's distressed by his condition
      and quietly begs him to leave for his sake. The next morning brings crushing shame. David suffers
      terrible physical and moral anguish, remembering "that indelible look which Agnes had given me."
      He can't contact her, doesn't know where she's staying, and feels he's betrayed everything good
      in their relationship. The following evening, Steerforth appears, and David confesses his wretchedness.
      Steerforth takes it lightly, but the incident has deepened David's sense of Agnes as his "good Angel"
      and moral compass. The chapter brilliantly captures the misery of youthful excess and the particular
      shame of disappointing someone whose good opinion matters most.
    title: 'XXIV: My First Dissipation'
  - href: epub/text/chapter-25.xhtml
    last_position: 374
    start_position: 357
    summary: Still suffering from shame, David receives a kind note from Agnes asking him to visit. At
      Mr. Waterbrook's house, David tearfully apologizes, and Agnes gently forgives him. She then warns
      him against Steerforth—his "bad Angel"—basing her judgment on Steerforth's character and influence
      over David. Though David defends Steerforth passionately, Agnes's words create a shadow over his
      feelings. Agnes reveals that Uriah Heep is entering partnership with her father, exploiting Mr.
      Wickfield's weaknesses until "papa is afraid of him." She accepted this sacrifice to relieve her
      father's distress. That evening, David attends a stiff dinner party at the Waterbrooks' where guests
      obsess over aristocratic "Blood." David happily reunites with Traddles, now reading for the bar.
      Afterward, David reluctantly invites Uriah home for coffee. At David's chambers, Uriah reveals he's
      in love with Agnes and intends to marry her, having wormed his way into the family's dependence.
      He asks David to keep his secret and not oppose him. David is horrified but powerless. Uriah, unable
      to return to his boarding house, sleeps before David's fire. David spends a nightmarish, sleepless
      night haunted by the image of this "red-headed animal" aspiring to Agnes, even checking on the sleeping
      Uriah multiple times in revulsion. The chapter powerfully contrasts Agnes's pure goodness with Uriah's
      repulsive manipulation, deepening the threat to the Wickfield household.
    title: 'XXV: Good and Bad Angels'
  - href: epub/text/chapter-26.xhtml
    last_position: 389
    start_position: 375
    summary: Mr. Spenlow invites David to his home in Norwood. David arrives to meet Spenlow's daughter
      Dora—and instantly falls desperately in love. Dora is pretty, childlike, and accompanied by her
      little dog Jip. To David's shock, Dora's companion is Miss Murdstone, his childhood tormentor. Miss
      Murdstone coldly proposes they maintain distant civility given their history, and David agrees.
      But David barely notices, consumed by infatuation with Dora. That night he can only think of her
      "girlish, bright-eyed lovely" perfection. Next morning, David encounters Dora in the garden. She
      complains that Miss Murdstone is "so absurd" and talks only to her dog Jip, who jealously barks
      at David. At church, David hears nothing but Dora. Returning to London, David becomes obsessed.
      He buys expensive waistcoats, wears tight boots, and walks miles hoping to glimpse Dora. He haunts
      fashionable streets and shops. His work at Doctors' Commons becomes a daydream about Dora—he sees
      her name engraved on the silver oar of the Admiralty Court. Mrs. Crupp, his landlady, penetrates
      his secret, noting his changed eating and grooming habits as symptoms of love. She offers motherly
      advice to "cheer up" and suggests distracting himself with skittles. The chapter brilliantly captures
      the all-consuming, irrational nature of first love, with David completely transformed into a lovesick
      young man, his practical judgment entirely overthrown by passion for the enchanting but shallow
      Dora.
    title: 'XXVI: I Fall Into Captivity'
  - href: epub/text/chapter-27.xhtml
    last_position: 399
    start_position: 390
    summary: 'David visits his old schoolfellow Traddles in Camden Town, finding him in modest lodgings
      above dubious neighbors. Traddles, cheerful despite poverty, is reading for the bar while doing
      legal copying and encyclopedia work to survive. He shares chambers with three others and employs
      a quarter-share of a clerk. Traddles reveals he''s engaged to "the dearest girl"—a curate''s daughter
      in Devonshire, one of ten children. They''ve begun accumulating furniture: a flowerpot and a small
      marble-topped table. Traddles explains they operate on the motto "Wait and hope," prepared for a
      long engagement. The landlords below are revealed to be the Micawbers. Mr. Micawber appears, unchanged
      in his theatrical eloquence and financial distress. Mrs. Micawber, "a little more slatternly," nearly
      faints with emotion at seeing David. The Micawbers are as impecunious as ever, with Mr. Micawber
      working on commission selling corn (unsuccessfully) while waiting for "something to turn up." They
      invite David to return for dinner. Later, Mr. Micawber confides he''s engaged in corn sales and
      expecting a new addition to the family, while his wife''s relations express "dissatisfaction," which
      Micawber repels "with scorn, and with defiance!" The chapter reunites David with two contrasting
      figures from his past: the steadfast, patient Traddles, whose good nature and optimism persist despite
      hardship, and the ever-hopeful, ever-impoverished Micawbers, whose cheerful resilience masks perpetual
      crisis. Both represent forms of honorable struggle against adversity.'
    title: 'XXVII: Tommy Traddles'
  - href: epub/text/chapter-28.xhtml
    last_position: 418
    start_position: 400
    summary: 'David hosts dinner for the Micawbers and Traddles. Despite Mrs. Crupp''s incompetence ruining
      the food, Mr. Micawber saves the meal by improvising "deviled" mutton on the gridiron, and the party
      becomes merry. Mrs. Micawber delivers a speech about her husband''s prospects, dismissing corn and
      coals as "not remunerative." She proposes he "throw down the gauntlet to society" through advertisements,
      financed by raising money on a bill. After toasting "D." (Dora), Micawber slips David a desperate
      letter: he''s "Crushed," a broker''s man possesses his lodgings, and Traddles''s £23 acceptance
      is unpaid. David warns Traddles about lending his name, but Traddles has already done so. Later,
      Steerforth arrives from Yarmouth with news: Mr. Barkis is dying. Steerforth has been secretly visiting
      Yarmouth and speaks of the Peggottys dismissively. He urges David to "Ride on over all obstacles"
      in life. David decides to visit dying Barkis. Steerforth invites him to Highgate first, enigmatically
      asking David to "stand between Rosa Dartle and me." They part warmly, Steerforth asking David to
      "think of me at my best" if they''re ever separated. David nearly confesses his doubts but holds
      back out of loyalty to Agnes''s confidence. Watching Steerforth walk home, David wishes "for the
      first time, that he had some worthy race to run," sensing something amiss beneath his friend''s
      brilliance and restless energy.'
    title: 'XXVIII: Mr. Micawber’s Gauntlet'
  - href: epub/text/chapter-29.xhtml
    last_position: 426
    start_position: 419
    summary: 'David visits Highgate before traveling to Yarmouth. Rosa Dartle watches him intensely, comparing
      his face with Steerforth''s, searching for something. She confronts David privately, desperately
      asking what is leading Steerforth—"anger, hatred, pride, restlessness, wild fancy, love?" David
      honestly knows nothing. Rosa''s scar throbs as she makes him swear secrecy. At dinner, Rosa speculates
      whether people of similar temperament would divide more deeply if they quarreled. Mrs. Steerforth
      dismisses any possibility of quarreling with her son. Throughout the day, Steerforth charms Rosa
      from sharpness into pleased companionship. That evening, Rosa plays harp and sings an unearthly
      Irish song with fearful passion. Steerforth puts his arm around her affectionately; Rosa strikes
      him "with the fury of a wild cat" and storms out. Mrs. Steerforth attributes this to Rosa''s "soured
      temper." That night, Steerforth asks David to promise: "If anything should ever separate us, you
      must think of me at my best." David assures him of unchanging love. Next morning, David finds Steerforth
      sleeping peacefully and leaves. The chapter ends with David''s ominous narration from the future:
      "Never more, oh God forgive you, Steerforth! to touch that passive hand in love and friendship.
      Never, never more!" The foreshadowing is unmistakable—something terrible is imminent, and this is
      David''s last sight of his beloved friend in innocence and peace.'
    title: 'XXIX: I Visit Steerforth at His Home, Again'
  - href: epub/text/chapter-30.xhtml
    last_position: 434
    start_position: 427
    summary: 'David arrives in Yarmouth and visits Mr. Omer, who reports Mr. Barkis is dying. Omer notes
      that Em''ly seems "unsettled"—still pretty and hardworking but lacking heart, clinging ever tighter
      to her uncle. David goes to the Peggotty household, where Em''ly sits trembling by the fire. When
      her uncle suggests she go home with Ham, she begs to stay, revealing deep distress despite Ham''s
      gentle presence. Upstairs, Mr. Barkis lies dying, clutching his treasure box, muttering "Old clothes!"
      Mr. Peggotty explains the local belief: "People can''t die, along the coast, except when the tide''s
      pretty nigh out." As the tide ebbs, Barkis briefly revives, recognizes David, and speaks his final
      words: "Barkis is willin''!" With the outgoing tide, he dies. This chapter, though titled "A Loss,"
      centers on Barkis''s death, but the real loss is foreshadowed through Em''ly''s strange behavior.
      Her trembling, her desperate clinging to her uncle, her tearful self-reproach about not being good
      enough—all signal her inner turmoil. The chapter''s famous line "Barkis is willin''" echoes his
      marriage proposal to Peggotty, creating a poignant full-circle moment. The symbolism of dying with
      the tide reflects the natural rhythms of the coastal community. Em''ly''s extreme distress, though
      attributed to death''s presence, suggests a deeper crisis approaching. The chapter balances tenderness
      (Barkis''s gentle death) with foreboding (Em''ly''s inexplicable anguish).'
    title: 'XXX: A Loss'
  - href: epub/text/chapter-31.xhtml
    last_position: 443
    start_position: 435
    summary: 'David helps Peggotty with Barkis''s affairs, discovering nearly £3,000 in his treasure box.
      Barkis left income to Mr. Peggotty for life, remainder to Peggotty, Em''ly, and David; the rest
      to Peggotty. After the quiet Blunderstone funeral, David joins the family at the boathouse. Mr.
      Peggotty cheerfully lights Em''ly''s candle in the window. Ham arrives alone, deadly pale, with
      devastating news: Em''ly has run away. Her letter reveals she''s gone to become "a lady," begging
      forgiveness and telling them to think of her as dead. Mr. Peggotty demands to know who took her.
      Ham reveals servants and a gentleman were seen with Em''ly at dawn on the Norwich road—the man is
      Steerforth. David is paralyzed by horror at his friend''s betrayal. Mr. Peggotty announces he''ll
      "seek my niece" across the world. Mrs. Gummidge, transformed by crisis, becomes strong and comforting
      rather than complaining. David''s guilt overwhelms him—he introduced Steerforth to this innocent
      family, enabling this destruction. The "greater loss" encompasses Em''ly''s ruin, Mr. Peggotty''s
      shattered happiness, Ham''s destroyed future, the family''s honor, and David''s friendship with
      Steerforth. The chapter ends with collective weeping as the magnitude of the catastrophe settles
      over them. David''s trust and love have been weaponized against those he cares for, creating a devastating
      betrayal on multiple levels that will reverberate throughout the remainder of the novel.'
    title: 'XXXI: A Greater Loss'
  - href: epub/text/chapter-32.xhtml
    last_position: 461
    start_position: 444
    summary: 'Despite Steerforth''s betrayal, David finds he "never had loved Steerforth better than when
      the ties that bound me to him were broken," grieving for what his friend might have been. The town
      sympathizes with Mr. Peggotty and Ham. On the beach, Mr. Peggotty announces he''ll seek Em''ly worldwide.
      He wants the old boat kept unchanged, candle lit nightly, so if she returns penitent, she''ll find
      welcome. Ham will work and support the search with his savings. Mrs. Gummidge transforms into a
      capable, devoted caretaker. In London, David and Mr. Peggotty confront Mrs. Steerforth, who coldly
      refuses to allow Steerforth to marry Em''ly—such a match would disgrace him. Mr. Peggotty eloquently
      pleads, but she''s adamant: Steerforth will receive no forgiveness unless he abandons Em''ly. Rosa
