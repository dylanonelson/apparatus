    title: 'XLIV: Our Housekeeping'
  - href: epub/text/chapter-45.xhtml
    last_position: 645
    start_position: 631
    summary: 'Mrs. Markleham, the "Old Soldier," constantly takes Mrs. Strong to amusements supposedly
      for her benefit but really for her own pleasure, while Dr. Strong grows sadder. Aunt Betsey believes
      Mr. Dick has a plan to help. One evening, Mr. Dick confides to David that he understands the Doctor
