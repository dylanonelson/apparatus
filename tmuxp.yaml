session_name: aie
start_directory: ./
windows:
  - window_name: app
    start_directory: ./
    layout: even-horizontal
    panes:
      - start_directory: ./frontend
        shell_command:
          - pnpm run dev
      - start_directory: ./reader_api
        shell_command:
          - uvicorn app.main:app --port 8000 --reload --log-level info
  - window_name: publications
    start_directory: ./
    layout: even-horizontal
    panes:
      - start_directory: ./publication_api
        shell_command:
          - make dev
      - shell_command:
          - docker build -f readium.Dockerfile -t readium-local . && docker run -p 15080:15080 readium-local
  - window_name: infra
    start_directory: ./
    layout: even-horizontal
    panes:
      - shell_command:
          - |
            docker run --rm --name apparatus-db \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=apparatus \
              -p 5432:5432 \
              postgres:18
      - shell_command:
          - |
            docker run --rm --name jaeger \
              -p 16686:16686 \
              -p 4317:4317 \
              -p 4318:4318 \
              -p 5778:5778 \
              -p 9411:9411 \
              cr.jaegertracing.io/jaegertracing/jaeger:2.11.0
      - shell_command:
          - ollama serve
