        text: "bed, and show me the quiet churchyard out of the bedroom window, with the dead all lying in their graves at rest, below the solemn moon.\n\t\t\tThere is nothing half so green that I know anywhere, as the grass of that churchyard; nothing half so shady as its trees; nothing half so quiet as its tombstones. The sheep are feeding there, when I kneel up, early in the morning, in my little bed in a closet within my mother's room, to look out at it; and I see the red light shining on the sundial, and think within myself, \"Is the sundial glad, I wonder, that it can tell the time again?\"\n\t\t\tHere is our pew in the church. What a high-backed pew! With a window near it, out of which our house can be seen, and is seen many times during the morning's service, by Peggotty, who likes to make herself as sure as she can that it's not being robbed, or is not in flames. But though Peggotty's eye wanders, she is much offended if mine does, and frowns to me, as I stand upon the seat, that I am to look at the clergyman. But I can't always look at him⁠—I know him without that white thing on, and I am afraid of his wondering why I stare so, and perhaps stopping the service to inquire⁠—and what am I to do? It's a dreadful thing to gape, but I must do something. I look at my mother, but she pretends not to see me. I look at a boy in the aisle, and he makes faces at me. I look at the sunlight coming in at the open door through the porch, and there I see a stray sheep⁠—I don't mean a sinner, but mutton⁠—half making up his mind to come into the church. I feel that if I looked at him any longer, I might be tempted to say something out loud; and what would become of me then! I look up at the monumental tablets on the wall, and try to think of Mr. Bodgers late of this parish, and what the feelings of Mrs. Bodgers must have been, when affliction sore, long time Mr. Bodgers bore, and physicians were in vain. I wonder whether they called in Mr. Chillip, and he was in vain; and if