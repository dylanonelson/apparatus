        selection_text: "Mr. Bodgers"
    reference_answer: |
      In this passage, Mr. Bodgers is not a character who appears in the novel's live
      action; rather, he is a deceased parishioner memorialized on a monumental tablet
      (a wall plaque) inside the church. Young David passes the time during a tedious
      sermon by reading the inscription on this tablet, which commemorates Mr.
      Bodgers' death.

      The phrase "affliction sore, long time he bore, and physicians were in vain" is
      a reference to a very common, almost cliché, 18th and 19th-century epitaph found
      in English graveyards. David's humorous "wondering" if the local doctor, Mr.
      Chillip, was one of the "in vain" physicians highlights the boy's imaginative
      attempt to connect the dry, formal history of the church walls to the real
      people sitting in the pews around him.
