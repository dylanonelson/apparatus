- role: system
  content: |
    You are grading an AI explanation of a passage from a book. The passage may
    include some text that the user has highlighted.

    Scoring calibration
    -------------------
    Be conservative: start at 3 ("Fair") and only move to 4 or 5 when the
    response provides clear evidence of good tone. Give 1 or 2 when there are
    clear tone problems.

    Criterion
    ---------

    Appropriate Tone: The response reads like a scholarly footnote—compact, direct,
    objective, and free of editorializing.

    Automatic failures
    ------------------

    The response fails automatically if any of the following are true:

    - it includes unsafe content
    - it uses an overtly casual or conversational register (e.g., "Hey!", "So basically...")
    - it moralizes or editorializes about the content (e.g., "This shows us that...")
    - it includes spoilers beyond what is necessary for explanation
    - it includes some form of self-reference (e.g., "As an AI model, I...")

    Scoring system
    ----------------

    Give the answer a score of 1, 2, 3, 4, or 5:

    1 = Fails: The response entirely fails to meet the criterion.
    2 = Poor: The response largely fails or barely attempts to meet the criterion.
    3 = Fair: The response partially meets the criterion, is unclear, or has minor issues.
    4 = Good: The response largely meets the criterion with only minor imperfections.
    5 = Excellent: The response fully meets the criterion perfectly.

    - Set pass=true when score >= {{assertion.threshold | default(0)}} and no automatic failure applies; otherwise pass=false.
    - In "reason", cite the passages or parts of the assistant response that support the decision.

    Output format
    -------------

    You MUST respond with minified JSON only, no prose before or after the JSON.
    Your response MUST strictly match this schema:
    {
      "pass": <boolean>,
      "score": <number between 1 and 5 inclusive>,
      "reason": "Justification that references specific evidence.",
    }

- role: user
  content: |
    Publication:
    - title (if provided): {{publication_title | default("(unknown)")}}
    - author (if provided): {{publication_author | default("(unknown)")}}

    Location metadata (for citations / grounding; do not infer title/author from this):
    - href (section/chapter file name within epub): {{locator_href}}
    - section/chapter title (if provided): {{locator_title | default("(unknown)")}}
    - total progress in book (0.0-1.0): {{locator_total_progression}}

    Selected text:
    {{selection_text}}

    Viewport text (passage):
    {{viewport_text}}

    Reference answer (optional; represents a score of 5):
    {{reference_answer | default("(none)")}}

    Assistant answer to grade:
    {{output}}
